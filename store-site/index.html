<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="雪约：滑雪人群的顺路拼车与同行协调工具。" />
    <title>雪约 · 滑雪顺路拼车</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="./index.html">雪约</a>
        <nav class="nav" aria-label="网站导航">
          <a href="./privacy.html">隐私政策</a>
          <a href="./support.html">支持</a>
        </nav>
      </header>

      <section class="hero">
        <div class="eyebrow">滑雪顺路拼车</div>
        <h1>把空座，<br />留给顺路的人。</h1>
        <p class="lead">
          雪约帮助滑雪人群把出发时间、雪场、人数、雪具和报价一次说清。
          先看路线，再确认同行。
        </p>
      </section>

      <section class="route" aria-label="示例拼车路线">
        <div class="stop">
          <span class="dot"></span>
          <div><strong>长春 · 世纪广场</strong><span>07:00 出发</span></div>
        </div>
        <div class="stop">
          <span class="dot pickup"></span>
          <div><strong>生态大街 · 顺路接人</strong><span>路线更新至第 2 版</span></div>
        </div>
        <div class="stop">
          <span class="dot end"></span>
          <div><strong>松花湖雪场</strong><span>预计 08:55 到达</span></div>
        </div>
      </section>

      <section class="cards" aria-label="产品原则">
        <article class="card">
          <strong>先看路线</strong>
          <p>接人点加入后，绕行时间直接展示。</p>
        </article>
        <article class="card">
          <strong>再谈价格</strong>
          <p>按人报价，双方确认后线下结算。</p>
        </article>
        <article class="card">
          <strong>未成交不锁座</strong>
          <p>车主座位和路线不会被提前占用。</p>
        </article>
      </section>

      <div class="actions">
        <a class="button" href="./privacy.html">查看隐私政策</a>
        <a class="button secondary" href="./support.html">获取支持</a>
      </div>

      <footer class="footer">雪约不提供在线支付、资金托管或承运担保。</footer>
    </main>
  </body>
</html>
