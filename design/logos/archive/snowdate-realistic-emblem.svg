      <stop offset=".38" stop-color="#70EFFF"/>
      <stop offset="1" stop-color="#0A5ED3"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020F36" flood-opacity=".45"/>
    </filter>
    <filter id="personShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#071A43" flood-opacity=".5"/>
    </filter>
    <clipPath id="tileClip">
      <rect width="1024" height="1024" rx="220"/>
    </clipPath>
  </defs>

