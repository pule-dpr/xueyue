      <stop offset="1" stop-color="#C5DDF8"/>
    </linearGradient>
    <linearGradient id="carBody" x1="180" y1="465" x2="850" y2="835" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset=".48" stop-color="#DCE9F8"/>
      <stop offset="1" stop-color="#AFC8E6"/>
    </linearGradient>
    <linearGradient id="glass" x1="512" y1="310" x2="512" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09255E"/>
      <stop offset="1" stop-color="#0A3C8D"/>
    </linearGradient>
    <linearGradient id="jacket" x1="430" y1="350" x2="585" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#EEF4FB"/>
