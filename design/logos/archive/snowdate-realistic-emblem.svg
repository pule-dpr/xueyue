<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="512" y1="22" x2="512" y2="1002" gradientUnits="userSpaceOnUse">
      <stop stop-color="#076CF2"/>
      <stop offset=".55" stop-color="#074CC5"/>
      <stop offset="1" stop-color="#092A73"/>
    </linearGradient>
    <linearGradient id="snow" x1="512" y1="790" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
